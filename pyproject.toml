[project]
name = "loom-kernel"
version = "1.7.1"
description = "Loom Python project"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.18,<1.0",
    "structlog>=24.4,<26.0",
    "omegaconf>=2.3,<3.0",
    "prometheus-client>=0.20",
    "aiocache>=0.12,<1.0",
    "typing_extensions>=4.12",
    "opentelemetry-api>=1.27,<2.0",
]

[project.optional-dependencies]
rest = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "httptools>=0.6,<1.0",
    "uvloop>=0.21,<1.0; sys_platform != 'win32'",
    "prometheus-client>=0.20",
]
sqlalchemy = [
    "sqlalchemy>=2.0,<3.0",
]
clickhouse = [
    "clickhouse-connect>=0.9.2,<1.0",
]
dynamodb = [
    "boto3>=1.35",
]
jwt = [
    "pyjwt[crypto]>=2.8,<3",
]
config = [
    "omegaconf>=2.3,<3.0",
    "fsspec>=2024.2.0",
]
config-ssm = [
    "omegaconf>=2.3,<3.0",
    "fsspec>=2024.2.0",
    "boto3>=1.35",
]
cache = [
    "aiocache>=0.12,<1.0",
    "omegaconf>=2.3,<3.0",
]
etl-polars = [
    "polars>=1.0,<2.0",
    "deltalake>=1.6.2,<2.0",
    "pyarrow>=14.0",
    "fsspec>=2024.2.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]
etl-spark = [
    "pyspark>=3.5,<4.0",
    "delta-spark>=3.2,<4.0",
    "findspark>=2.0,<3.0",
    "fsspec>=2024.2.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]
etl-otel = [
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]
prefect = [
    "prefect>=3.0,<4.0",
    "fsspec>=2024.2.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3,<3.0",
    "boto3>=1.35",
    "docker>=7.0",
]
pyspark = [
    "pyspark>=3.5,<4.0",
]
prometheus = [
    "prometheus-client>=0.20",
]
streaming = [
    "anyio>=4.0,<5.0",
    "confluent-kafka>=2.6,<3.0",
    "bytewax>=0.21",
    "uvloop>=0.21,<1.0; sys_platform != 'win32'",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]
ai-pydantic = [
    "pydantic-ai-slim>=2,<3",
]
ai-bedrock = [
    "pydantic-ai-slim[bedrock]>=2,<3",
]
ai-openai = [
    "pydantic-ai-slim[openai]>=2,<3",
]
ai-anthropic = [
    "pydantic-ai-slim[anthropic]>=2,<3",
]
ai-a2a = [
    "fasta2a>=0.6,<1",
    "a2a-sdk>=1.1,<2",
]
ai-harness = [
    "pydantic-ai-harness[skills]>=0.28,<1",
]
# Logfire is an OTel distribution, not a second telemetry stack: it installs the
# global TracerProvider that loom then SHARES via OtelConfig(endpoint="").
# See docs/ai/observability.md — a non-empty endpoint makes loom build its own
# provider, and the two are mutually exclusive by construction.
logfire = [
    "logfire>=4.0,<5",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
]
celery = [
    "celery>=5.3,<6.0",
    "kombu>=5.3,<6.0",
    "redis>=5.0,<6.0",
]

[project.entry-points."loom.ai.engines"]
pydantic-ai = "loom.ai.engines.pydantic_ai.provider:PydanticAIEngineProvider"

# Authentication strategies for the remote endpoints loom calls out to: MCP
# servers and A2A agents alike, since the contract is httpx.Auth and knows
# nothing of either protocol. A deployment plugs in its own from its own
# package under the same group; loom ships only these three thin delegations.
# See docs/ai/mcp.md and docs/ai/a2a.md.
[project.entry-points."loom.ai.remote_auth"]
oauth = "loom.ai.remote_auth:standard_oauth"
bearer = "loom.ai.remote_auth:bearer_token"
static = "loom.ai.remote_auth:static_headers"

[project.entry-points."loom.etl.backends"]
polars = "loom.etl.backends.polars.provider:PolarsProvider"
spark = "loom.etl.backends.spark.provider:SparkProvider"

[build-system]
requires = [
    "hatchling>=1.24.0",
]
build-backend = "hatchling.build"

[dependency-groups]
# Isolated on purpose: fastmcp pulls a large transitive tree that only the MCP
# tests need, so the cost is paid by whoever asks for it — `uv sync --group
# mcp-tests` — not by every contributor's default install. Those tests skip
# when fastmcp is absent.
# The 4.x floor is not cosmetic: pydantic-ai builds its HTTP transport with
# `verify=`, which fastmcp only accepts from 4.0 on, so `headers` and `auth`
# — the whole of MCP authentication — raise TypeError against 2.x.
mcp-tests = [
    "fastmcp>=4,<5",
]

dev = [
    "aiocache>=0.12,<1.0",
    "aiosqlite>=0.20.0",
    "commitizen>=3.30.0",
    "celery>=5.3,<6.0",
    "fakeredis>=2.23.0",
    "fastapi>=0.115,<1.0",
    "greenlet>=3.0.0",
    "mypy>=1.11.0,<2.0",
    "omegaconf>=2.3,<3.0",
    "pydantic>=2.0,<3.0",
    "pre-commit>=3.8.0",
    "pyright>=1.1.390,<2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyjwt[crypto]>=2.12.0",
    "redis>=5.0.0",
    "ruff>=0.9.0,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "polars>=1.0,<2.0",
    "clickhouse-connect>=0.9.2,<1.0",
    "pyarrow>=14.0",
    "deltalake>=1.6.2,<2.0",
    "fsspec>=2024.2.0",
    "httptools>=0.6,<1.0",
    "uvloop>=0.21,<1.0; sys_platform != 'win32'",
    "prometheus-client>=0.20",
    "delta-spark>=3.2,<4.0",
    "chispa>=0.10,<1.0",
    "pytest-cov>=7.1.0",
    "findspark>=2.0.1",
    "confluent-kafka>=2.6,<3.0",
    "bytewax>=0.21",
    "boto3>=1.35",
    "pymongo>=4.6,<5.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
    "prefect>=3.0,<4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "types-pyyaml>=6.0.12.20260724",
    "jsonschema>=4.26.0",
    "pydantic-ai-slim[anthropic,bedrock,openai]>=2,<3",
    "fasta2a>=0.6,<1",
    "a2a-sdk>=1.1,<2",
    "pydantic-ai-harness[skills]>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/loom",
]
# The agent-spec JSON Schema is shipped as package data so a generator can
# validate its output against the published contract without importing loom —
# and, by extracting it from the wheel or sdist, without installing loom at all
# (FR-009). 'specs/' is not distributed, so the schema must live under 'src/'.
include = [
    "src/loom/py.typed",
    "src/loom/ai/declarative/schemas/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "Caller",
    "Exists",
    "Input",
    "Load",
    "LoadById",
    "loom.core.use_case.Caller",
    "loom.core.use_case.Exists",
    "loom.core.use_case.Input",
    "loom.core.use_case.Load",
    "loom.core.use_case.LoadById",
    "loom.core.use_case.markers.Caller",
    "loom.core.use_case.markers.Exists",
    "loom.core.use_case.markers.Input",
    "loom.core.use_case.markers.Load",
    "loom.core.use_case.markers.LoadById",
]

[tool.pyright]
pythonVersion = "3.11"
include = [
    "src",
]
typeCheckingMode = "standard"
reportMissingModuleSource = "none"
reportMissingImports = "none"
reportPrivateImportUsage = "none"
ignore = [
    "src/loom/etl/testing/spark.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = [
    "src",
]
exclude = [
    "^tests/",
]

[[tool.mypy.overrides]]
module = [
    "pyspark.*",
    "delta.*",
    "findspark",
    "fsspec.*",
    "chispa.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# 'fasta2a' ships no py.typed marker, but its 'schema' module is the A2A wire
# contract used by 'loom.ai.a2a.server': following it keeps those TypedDicts
# type-checked instead of degrading them to Any.
[[tool.mypy.overrides]]
module = [
    "fasta2a.*",
]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = [
    "docker",
    "docker.*",
    "requests",
    "requests.*",
    "prefect",
    "prefect.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/contract",
]
pythonpath = [
    "src",
]
addopts = "-ra --log-disable=aiosqlite"
asyncio_mode = "auto"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
markers = [
    "bytewax: tests that exercise the Bytewax adapter and runtime wiring",
    "kafka: tests that exercise Kafka transport and codecs",
    "integration: end-to-end streaming flow tests",
    "slow: long-running tests that should be opt-in in CI",
    "live: tests that call a real model provider; skipped without credentials",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.7.1"
tag_format = "v$version"
version_files = [
    "pyproject.toml:project.version",
]
update_changelog_on_bump = true

[tool.semantic_branch]
prerelease = [
    "hotfix/.*",
    "feature/.*",
    "feat/.*",
    "multifeature/.*",
    "breaking/.*",
    "fix/.*",
]
patch = [
    "hotfix/.*",
    "fix/.*",
]
minor = [
    "feature/.*",
    "feat/.*",
    "multifeature/.*",
]
major = [
    "breaking/.*",
]
prerelease_ignore = [
    "docs/.*",
]
release_ignore = [
    "wip/.*",
    "docs/.*",
    "chore/.*",
]
