name: ci-main

on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # uv is pinned to the same version in every workflow to avoid drift, and
      # installed from wheels only so no sdist setup script can run.
      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      - name: Quality report (strict)
        uses: the-reacher-data/loom-actions/actions/python/quality-report@e731576f4f9cf4ec2b36fddfc895d328c856d29f # v1
        with:
          src-dir: src
          test-dir: tests
          coverage-threshold: "80"
          fail-on-quality: "any"
          fail-on-security: "high"
          include-security: "true"

      # --frozen forces the committed uv.lock resolution and pytest-cov is
      # pinned to the version already locked in the dev group.
      # "--no-build" is intentionally omitted: omegaconf (a runtime dependency)
      # requires antlr4-python3-runtime 4.9.3, which ships no wheel on PyPI, so
      # the environment cannot be created from binaries only.
      # Fast lane: `-m "not integration"` deselects the suites that need a
      # provisioned external service; they run in the `integration` job with
      # those services actually up. Deselecting is deliberate over letting them
      # skip — a skipped test reads as approved, a deselected one reads as
      # "not this lane".
      - name: Run pytest with coverage and JUnit output
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --with "pytest-cov==7.1.0" \
            pytest -m "not integration" --cov --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Require SonarQube analysis configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SONAR_TOKEN}" ] || missing="${missing} SONAR_TOKEN(secret)"
          [ -n "${SONAR_HOST_URL}" ] || missing="${missing} SONAR_HOST_URL(secret)"
          [ -n "${SONAR_PROJECT_KEY}" ] || missing="${missing} SONAR_PROJECT_KEY(variable)"
          if [ -n "${missing}" ]; then
            echo "SonarQube scan cannot run, missing:${missing}"
            echo "Without it the scan is skipped and the only analysis left is"
            echo "SonarCloud Automatic Analysis, which ignores sonar-project.properties:"
            echo "exclusions and issue suppressions silently stop applying."
            exit 1
          fi

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Snyk dependency monitor
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

      - name: Snyk monitor by dependency scope (core/dev/extras)
        if: ${{ env.SNYK_TOKEN != '' }}
        shell: bash
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        run: |
          set -euo pipefail

          MANIFEST_DIR="$RUNNER_TEMP/snyk-manifests"
          mkdir -p "$MANIFEST_DIR"

          # Two exports of the same locked resolution: Snyk reads the plain
          # manifest, pip installs the hashed twin so every downloaded artifact
          # is verified against uv.lock.
          uv export --frozen --no-default-groups --no-dev --no-hashes --no-emit-project \
            -o "$MANIFEST_DIR/requirements-core.txt"
          uv export --frozen --no-default-groups --no-dev --no-emit-project \
            -o "$MANIFEST_DIR/hashed-core.txt"
          uv export --frozen --only-group dev --no-hashes --no-emit-project \
            -o "$MANIFEST_DIR/requirements-dev.txt"
          uv export --frozen --only-group dev --no-emit-project \
            -o "$MANIFEST_DIR/hashed-dev.txt"

          for extra in rest sqlalchemy config cache pyspark prometheus celery streaming; do
            uv export --frozen --no-default-groups --no-dev --extra "$extra" \
              --no-hashes --no-emit-project \
              -o "$MANIFEST_DIR/requirements-extra-${extra}.txt"
            uv export --frozen --no-default-groups --no-dev --extra "$extra" \
              --no-emit-project \
              -o "$MANIFEST_DIR/hashed-extra-${extra}.txt"
          done

          python -m pip install --require-hashes -r "$MANIFEST_DIR/hashed-core.txt"
          snyk monitor --skip-unresolved \
            --file="$MANIFEST_DIR/requirements-core.txt" --package-manager=pip \
            --project-name="loom-py/core" --target-reference="${GITHUB_REF_NAME:-master}"
          python -m pip install --require-hashes -r "$MANIFEST_DIR/hashed-dev.txt"
          snyk monitor --skip-unresolved \
            --file="$MANIFEST_DIR/requirements-dev.txt" --package-manager=pip \
            --project-name="loom-py/dev" --target-reference="${GITHUB_REF_NAME:-master}"

          for extra in rest sqlalchemy config cache pyspark prometheus celery streaming; do
            python -m pip install --require-hashes -r "$MANIFEST_DIR/hashed-extra-${extra}.txt"
            snyk monitor --skip-unresolved \
              --file="$MANIFEST_DIR/requirements-extra-${extra}.txt" \
              --package-manager=pip \
              --project-name="loom-py/extra-${extra}" \
              --target-reference="${GITHUB_REF_NAME:-master}"
          done

  # ---------------------------------------------------------------------------
  # Integration lane: everything marked `integration` needs a real external
  # service, so it runs here with the services actually provisioned — never as a
  # silent skip inside the fast lane. The same docker-compose.local.yaml that
  # developers use locally is the single source of truth for how these services
  # are configured.
  #
  # The Kafka suite runs twice: Redpanda is the fast loop, Apache Kafka in KRaft
  # mode is the fidelity check. The partitioned source uses the consumer group
  # purely as an offset store (assign, never subscribe), and that is exactly the
  # area where broker implementations legitimately diverge — a green Redpanda run
  # is not evidence that Apache Kafka agrees.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      - name: Configure uv environment path
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/uv-ci-integration" >> "$GITHUB_ENV"

      - name: Start integration services
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.local.yaml up -d redpanda kafka clickhouse

      - name: Wait for services to report healthy
        shell: bash
        run: |
          set -euo pipefail
          for service in redpanda kafka clickhouse; do
            container="$(docker compose -f docker-compose.local.yaml ps -q "$service")"
            for _ in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$container")"
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$container")" != "healthy" ]; then
              echo "::error::$service never became healthy"
              docker compose -f docker-compose.local.yaml logs "$service"
              exit 1
            fi
          done

      - name: Integration tests (Redpanda)
        shell: bash
        env:
          LOOM_KAFKA_IT_BOOTSTRAP: localhost:19092
        run: |
          set -euo pipefail
          uv run --frozen pytest -m integration -ra

      - name: Integration tests (Apache Kafka fidelity check)
        shell: bash
        env:
          LOOM_KAFKA_IT_BOOTSTRAP: localhost:19093
        run: |
          set -euo pipefail
          uv run --frozen pytest tests/integration/streaming/kafka -ra

      - name: Dump service logs on failure
        if: ${{ failure() }}
        shell: bash
        run: docker compose -f docker-compose.local.yaml logs --no-color --tail=200

      - name: Stop integration services
        if: ${{ always() }}
        shell: bash
        run: docker compose -f docker-compose.local.yaml down -v
