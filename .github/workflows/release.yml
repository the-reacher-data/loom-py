name: release

# A release ships everything merged since the last tag, up to the pull request
# that carries the `release` label. Merging that pull request is the
# authorisation; every other merge runs ci-main and publishes nothing. The
# dispatch is the recovery path for a release that stopped halfway.
on:
  pull_request:
    types: [closed]
    branches: ["master"]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: "Commit on master to release, for a run that stopped halfway"
        required: true

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The version is derived, never typed: the part is the highest one any branch
  # merged since the last tag asks for, so a batch holding a feature cannot ship
  # as a patch. The tag lands on the merge commit, which fixes the range — a
  # pull request merging a second later belongs to the next release.
  plan:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.pull_request.merged == true
              && contains(github.event.pull_request.labels.*.name, 'release')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
    env:
      MERGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.merge_sha || github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      # A commit reachable only from a branch would tag something master does
      # not carry, so the release refuses rather than tagging a side history.
      - name: Require the release commit on master
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release commit is not a full SHA: ${MERGE_SHA}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${MERGE_SHA}" origin/master; then
            echo "Release commit ${MERGE_SHA} is not on master."
            exit 1
          fi

      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m scripts.release.plan_release \
            --merge-sha "${MERGE_SHA}" --slug "${GITHUB_REPOSITORY}" | tee plan.txt
          PLAN=$(uv run --frozen python -m scripts.release.plan_release \
            --merge-sha "${MERGE_SHA}" --slug "${GITHUB_REPOSITORY}" --format github)
          VERSION=$(jq -r .version <<< "${PLAN}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Release v${VERSION}"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the release notes
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${MERGE_SHA}"
          uv run --frozen python -m scripts.release.build_release_notes \
            --version "${VERSION}" --output CHANGELOG_RELEASE.md

      - name: Store release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: CHANGELOG_RELEASE.md
          if-no-files-found: error
          retention-days: 1

      # The tag is created before the build because the version is derived from
      # it: hatch-vcs reads the tag, so a build without one produces a dev
      # version. Creating a tag that already points at this commit is not an
      # error, which is what makes a halted release re-runnable.
      - name: Create the immutable version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/v${VERSION}"
          TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}")
          TAG_COUNT=$(jq --arg ref "${TAG_REF}" '[.[] | select(.ref == $ref)] | length' <<< "${TAGS}")

          if [ "${TAG_COUNT}" -gt 1 ]; then
            echo "GitHub returned duplicate exact refs for ${TAG_REF}."
            exit 1
          elif [ "${TAG_COUNT}" -eq 1 ]; then
            REMOTE_SHA=$(jq -r --arg ref "${TAG_REF}" '.[] | select(.ref == $ref) | .object.sha' <<< "${TAGS}")
            if [ "${REMOTE_SHA}" != "${MERGE_SHA}" ]; then
              echo "Tag v${VERSION} points to ${REMOTE_SHA}, expected ${MERGE_SHA}."
              exit 1
            fi
            echo "Tag v${VERSION} already points at the release commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="${TAG_REF}" \
              -f sha="${MERGE_SHA}"
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Checked out at the tag, with its history, because hatch-vcs derives the
      # version from the tag this commit carries.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: v${{ needs.plan.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Wheels only: no sdist setup script can run while installing uv.
      - name: Install pinned uv
        run: |
          pip install --only-binary :all: "uv==0.10.2"

      # "--no-build" is intentionally omitted below: omegaconf (a runtime
      # dependency) requires antlr4-python3-runtime 4.9.3, which ships no wheel
      # on PyPI, so the environment cannot be created from binaries only.
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run --frozen --with "build==1.3.0" python -m build
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Package build modified tracked files."
            git status --short --untracked-files=no
            exit 1
          fi

      # The artifact must carry the version the tag names. A dev version here
      # means the build never saw the tag, and publishing it would burn a
      # version number on PyPI that nobody asked for.
      - name: Require the built version to match the tag
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "dist/loom_kernel-${VERSION}-py3-none-any.whl" ]; then
            echo "Built distributions do not carry version ${VERSION}:"
            ls -1 dist
            exit 1
          fi

      - name: Store distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      # Dispatching ci-main for the released commit; see that step.
      actions: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes

      - name: Update floating major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MAJOR=${VERSION%%.*}
          MAJOR_REF="refs/tags/v${MAJOR}"
          TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${MAJOR}")
          MAJOR_COUNT=$(jq --arg ref "${MAJOR_REF}" '[.[] | select(.ref == $ref)] | length' <<< "${TAGS}")

          if [ "${MAJOR_COUNT}" -gt 1 ]; then
            echo "GitHub returned duplicate exact refs for ${MAJOR_REF}."
            exit 1
          elif [ "${MAJOR_COUNT}" -eq 1 ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${MAJOR}" \
              -f sha="${RELEASE_SHA}" \
              -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="${MAJOR_REF}" \
              -f sha="${RELEASE_SHA}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          body_path: CHANGELOG_RELEASE.md

      - name: Select PyPI authentication
        id: pypi-auth
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PYPI_API_TOKEN}" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to PyPI (token mode)
        if: ${{ steps.pypi-auth.outputs.has-token == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-07-28 (handles Metadata-Version 2.5)
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish package to PyPI (trusted publisher)
        if: ${{ steps.pypi-auth.outputs.has-token == 'false' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-07-28 (handles Metadata-Version 2.5)

      # No push event announces a released commit, and nothing here changes
      # master, so ask for the run that validates the tip explicitly. Never
      # fatal: this asks for a check, it is not one.
      - name: Validate the released commit on master
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci-main.yml --repo "${GITHUB_REPOSITORY}" --ref master
