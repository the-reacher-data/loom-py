name: release

# Merging a pull request labelled `release` publishes everything merged since
# the last tag. The dispatch resumes a run that stopped halfway.
on:
  pull_request:
    types: [closed]
    branches: ["master"]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: "Commit on master to release"
        required: true

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: the-reacher-data/loom-actions/.github/workflows/release-on-label.yml@a6721128661fe10035ef27aecd8b4ed8d8531e6b # v1.2.0
    with:
      publish-to-pypi: true
      package-name: loom-kernel
      merge-sha: ${{ inputs.merge_sha || '' }}
