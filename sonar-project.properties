# python:S8544 / python:S8541 — the workflow steps that still omit --no-build do
# so because it provably breaks installation: omegaconf requires
# antlr4-python3-runtime, which ships no wheel on PyPI, and uv offers no
# per-package allow-list. Reason documented next to each command.
sonar.issue.ignore.multicriteria.e43.ruleKey=python:S8544
sonar.issue.ignore.multicriteria.e43.resourceKey=**/.github/workflows/*.yml
sonar.issue.ignore.multicriteria.e44.ruleKey=python:S8541
sonar.issue.ignore.multicriteria.e44.resourceKey=**/.github/workflows/*.yml

# python:S107 — IntoHistory.__init__ takes 14 parameters. All but ``ref`` are
# keyword-only with defaults: they are the SCD2 contract itself (keys, track,
# boundaries, delete policy, date type, partition scope). Grouping them into an
# options object would break every declarative target already written against
# this public DSL, and would hide the very names the DSL exists to expose.
sonar.issue.ignore.multicriteria.e45.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e45.resourceKey=**/etl/declarative/target/_history/_builder.py

# python:S107 — the agent pillar's composition roots and its capability phase
# take their collaborators as keyword-only parameters with defaults. Same
# reasoning as IntoHistory above: an options object would hide the very names a
# reader needs, and for a wiring function the parameter list IS the contract —
# it is what tells you, at a glance, everything the runtime is handed.
#
# TEMPORARY for two of them: runtime.py and a2a/server.py are scheduled to be
# split by responsibility (runtime/{_lifecycle,_mcp,_limits,_health}.py and the
# a2a binding already extracted). Both signatures shrink with that split, so
# e46 and e47 should be removed then rather than inherited.
sonar.issue.ignore.multicriteria.e46.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e46.resourceKey=**/ai/runtime.py
sonar.issue.ignore.multicriteria.e47.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e47.resourceKey=**/ai/a2a/server.py
sonar.issue.ignore.multicriteria.e48.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e48.resourceKey=**/ai/fastapi/endpoints.py
sonar.issue.ignore.multicriteria.e49.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e49.resourceKey=**/ai/compiler/phases/_capabilities.py

# python:S1142 — _url_fault returns one reason per unsafe URL shape: not https,
# no host, credentials in userinfo, a query string that may embed one. Guard
# clauses with an early return per case is exactly what the engineering
# standards ask for over a pyramid of ifs, and collapsing them into an
# accumulator to reach six would make the code worse to read and to extend.
sonar.issue.ignore.multicriteria.e50.ruleKey=python:S1142
sonar.issue.ignore.multicriteria.e50.resourceKey=**/ai/config.py

# python:S3776 — cognitive complexity, listed with no resource of its own on
# purpose: the pillar reports none today (verified with the equivalent ruff
# rules, C901 clean across all 42 modules). Kept as a note so the next reader
# knows the absence was measured, not assumed.

sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml
