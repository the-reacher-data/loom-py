# python:S1172 — "Remove the unused function parameter".
# _validate_marker_refs(input_binding=...) uses input_binding in `is None` guards
# (lines 308, 321). Sonar's dataflow analysis fails to track usage via None-checks.
sonar.issue.ignore.multicriteria.e16.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e16.resourceKey=src/loom/core/engine/compiler.py

# python:S1172 — InlineJobService.dispatch() and dispatch_parallel() accept
# countdown/priority/eta/on_all_success/on_any_failure to satisfy the JobService
# protocol. These params have no effect in inline mode (no broker) and cannot be
# removed without breaking the structural protocol contract.
sonar.issue.ignore.multicriteria.e17.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e17.resourceKey=src/loom/core/job/service.py

# python:S1440 — "Replace 'is' with '=='" flagged on `assert x is True/False`.
# In Python tests, `is True` / `is False` are intentional identity checks
# (stricter than == True). This is the recommended pattern in pytest and aligns
# with PEP 8 which explicitly warns against `== True`. False positive for tests.
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S1440
sonar.issue.ignore.multicriteria.e7.resourceKey=tests/**/*.py

# python:S4830 — "Use asynchronous features or remove the async keyword".
# pytest-asyncio (asyncio_mode=auto) requires `async def` for all tests that
# run inside an event loop, even when the test body has no explicit `await`.
# Removing `async` would break tests that use async fixtures or future-proof
# tests where await is added incrementally. False positive for test suites.
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.e8.resourceKey=tests/**/*.py

# Same S4830 suppression with alternate path matcher used by some Sonar setups.
sonar.issue.ignore.multicriteria.e18.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.e18.resourceKey=**/tests/**/*.py

# python:S1186 — "Add a nested comment explaining why this method is empty".
# Test doubles and protocol stubs in tests intentionally use empty bodies (`pass`)
# to keep fixtures minimal and focused on behavior under test.
sonar.issue.ignore.multicriteria.e19.ruleKey=python:S1186
sonar.issue.ignore.multicriteria.e19.resourceKey=tests/**/*.py

# Same S1186 suppression with alternate path matcher used by some Sonar setups.
sonar.issue.ignore.multicriteria.e20.ruleKey=python:S1186
sonar.issue.ignore.multicriteria.e20.resourceKey=**/tests/**/*.py

# python:S1244 — "Do not perform equality checks with floating point values".
# Integration tests compare domain/API responses where values originate from
# controlled fixtures (not arithmetic). pytest.approx() is used in unit tests.
# Integration assertions use exact literal values that match the fixture data.
sonar.issue.ignore.multicriteria.e9.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.e9.resourceKey=tests/integration/**/*.py

# python:S7503 — "Coroutines should include at least one await expression".
# CeleryJobService.run() is intentionally async-without-await: the JobService
# protocol declares run() as async def, so all concrete implementations must
# match the coroutine signature. The Celery implementation always raises
# NotImplementedError because broker-backed execution goes through dispatch().
sonar.issue.ignore.multicriteria.e21.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e21.resourceKey=src/loom/celery/service.py

# python:S1172 — "Remove the unused function parameter".
# CeleryJobService.dispatch_parallel() accepts on_all_success/on_any_failure to
# satisfy the JobService protocol. Chord support (celery.chord) is deferred to a
# future piece; these params cannot be removed without breaking the interface.
sonar.issue.ignore.multicriteria.e22.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e22.resourceKey=src/loom/celery/service.py

# python:S2068 / python:S6437 — "hard-coded credentials" / "hard-coded secrets".
# _polars.py defines a static mapping from fsspec storage-option KEY NAMES
# ("endpoint_url", "key", "secret", "token") to their Rust ``object_store``
# equivalents. These strings are public fsspec/object_store field identifiers,
# never credential values. Renaming them would break compatibility with
# fsspec's documented storage_options API.
sonar.issue.ignore.multicriteria.e23.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e23.resourceKey=src/loom/etl/checkpoint/_backends/_polars.py
sonar.issue.ignore.multicriteria.e24.ruleKey=python:S6437
sonar.issue.ignore.multicriteria.e24.resourceKey=src/loom/etl/checkpoint/_backends/_polars.py
# Alternate rule keys some Sonar setups use for the same hard-coded-secret family.
sonar.issue.ignore.multicriteria.e25.ruleKey=python:S6418
sonar.issue.ignore.multicriteria.e25.resourceKey=src/loom/etl/checkpoint/_backends/_polars.py
sonar.issue.ignore.multicriteria.e26.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e26.resourceKey=src/loom/etl/checkpoint/_backends/_polars.py

