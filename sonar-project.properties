# python:S7503 — Authenticator.authenticate() is async by protocol so mechanisms
# that need I/O (API key lookup, session store, remote JWKS) are implementable;
# the JWT one resolves locally and never awaits. Starlette exception handlers are
# async on purpose too: a sync handler is dispatched to a threadpool.
sonar.issue.ignore.multicriteria.e41.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e41.resourceKey=**/rest/auth/jwt.py
sonar.issue.ignore.multicriteria.e42.ruleKey=python:S7503
